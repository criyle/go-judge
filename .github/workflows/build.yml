name: Build

env:
  GO_VERSION: "1.27"

on:
  push:
    branches: [master]
    tags: [v*]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum
      - name: Enable unprivileged user namespaces
        run: |
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          if sudo sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          unshare --user --map-root-user true
          echo "--- kernel security state ---"
          uname -a
          grep -E '^(Seccomp|Seccomp_filters):' /proc/self/status
          if command -v aa-status >/dev/null 2>&1; then
            sudo aa-status || true
          fi
      - name: Build go-judge for integration tests
        run: go build -o go-judge ./cmd/go-judge
      - name: Run unit and integration tests
        shell: bash
        run: |
          set -euo pipefail
          ./go-judge -silent > go-judge.log 2>&1 &
          server_pid=$!
          cleanup() {
            status=$?
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
            if [ "$status" -ne 0 ]; then
              echo "--- last 200 lines of go-judge startup/runtime log ---"
              tail -n 200 go-judge.log
            fi
            exit "$status"
          }
          trap cleanup EXIT
          ready=0
          for _ in $(seq 1 30); do
            if curl --fail --silent --show-error http://localhost:5050/version; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "go-judge exited during startup"
              exit 1
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "go-judge did not become ready within 30 seconds"
            exit 1
          fi
          go test ./...
          go test -tags integration -count=1 ./integration_test

      - name: Upload go-judge log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: go-judge-log
          path: go-judge.log
          if-no-files-found: ignore

  goreleaser-release:
    name: Goreleaser release
    if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum
      - name: Remove unsupported tags
        shell: bash
        run: |
          tags=$(git tag -l 'pb/*')
          if [ -n "$tags" ]; then
            git tag -d $tags
          fi
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload assets
        uses: actions/upload-artifact@v7
        with:
          name: go-judge
          path: dist/
          retention-days: 7

  goreleaser-snapshot:
    name: Goreleaser snapshot
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum
      - name: Remove unsupported tags
        shell: bash
        run: |
          tags=$(git tag -l 'pb/*')
          if [ -n "$tags" ]; then
            git tag -d $tags
          fi
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Test GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --snapshot --clean
      - name: Upload assets
        uses: actions/upload-artifact@v7
        with:
          name: go-judge
          path: dist/
          retention-days: 7

  upload-artifacts:
    name: Upload selected artifacts
    if: always() && (needs.goreleaser-release.result == 'success' || needs.goreleaser-snapshot.result == 'success')
    runs-on: ubuntu-latest
    needs:
      - goreleaser-release
      - goreleaser-snapshot
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: go-judge
          path: dist
      - name: Upload go-judge Windows amd64_v3
        uses: actions/upload-artifact@v7
        with:
          name: go-judge_windows_amd64_v3
          path: dist/go-judge_windows_amd64_v3/go-judge.exe
          retention-days: 7
      - name: Upload go-judge Windows arm64_v8.0
        uses: actions/upload-artifact@v7
        with:
          name: go-judge_windows_arm64_v8.0
          path: dist/go-judge_windows_arm64_v8.0/go-judge.exe
          retention-days: 7
      - name: Upload go-judge Linux amd64_v3
        uses: actions/upload-artifact@v7
        with:
          name: go-judge_linux_amd64_v3
          path: dist/go-judge_linux_amd64_v3/go-judge
          retention-days: 7
      - name: Upload go-judge Linux arm64_v8.0
        uses: actions/upload-artifact@v7
        with:
          name: go-judge_linux_arm64_v8.0
          path: dist/go-judge_linux_arm64_v8.0/go-judge
          retention-days: 7
      - name: Upload go-judge macOS amd64_v3
        uses: actions/upload-artifact@v7
        with:
          name: go-judge_macos_amd64_v3
          path: dist/go-judge_darwin_amd64_v3/go-judge
          retention-days: 7
      - name: Upload go-judge macOS arm64_v8.0
        uses: actions/upload-artifact@v7
        with:
          name: go-judge_macos_arm64_v8.0
          path: dist/go-judge_darwin_arm64_v8.0/go-judge
          retention-days: 7
      - name: Upload go-judge-shell Windows amd64_v3
        uses: actions/upload-artifact@v7
        with:
          name: go-judge-shell_windows_amd64_v3
          path: dist/go-judge-shell_windows_amd64_v3/go-judge-shell.exe
          retention-days: 7
      - name: Upload go-judge-shell Windows arm64_v8.0
        uses: actions/upload-artifact@v7
        with:
          name: go-judge-shell_windows_arm64_v8.0
          path: dist/go-judge-shell_windows_arm64_v8.0/go-judge-shell.exe
          retention-days: 7
      - name: Upload go-judge-shell Linux amd64_v3
        uses: actions/upload-artifact@v7
        with:
          name: go-judge-shell_linux_amd64_v3
          path: dist/go-judge-shell_linux_amd64_v3/go-judge-shell
          retention-days: 7
      - name: Upload go-judge-shell Linux arm64_v8.0
        uses: actions/upload-artifact@v7
        with:
          name: go-judge-shell_linux_arm64_v8.0
          path: dist/go-judge-shell_linux_arm64_v8.0/go-judge-shell
          retention-days: 7
      - name: Upload go-judge-shell macOS amd64_v3
        uses: actions/upload-artifact@v7
        with:
          name: go-judge-shell_macos_amd64_v3
          path: dist/go-judge-shell_darwin_amd64_v3/go-judge-shell
          retention-days: 7
      - name: Upload go-judge-shell macOS arm64_v8.0
        uses: actions/upload-artifact@v7
        with:
          name: go-judge-shell_macos_arm64_v8.0
          path: dist/go-judge-shell_darwin_arm64_v8.0/go-judge-shell
          retention-days: 7
